<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup Page</title>

<style>

/* ===== BODY ===== */
body{
    margin:0;
    padding:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f0f0f,#1c1c1c);
}

/* ===== CENTER WRAPPER ===== */
.signup-wrapper{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ===== SIGNUP BOX ===== */
.signup-box{
    width:360px;
    padding:40px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,165,0,0.3);
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
    text-align:center;
    color:white;
}

/* TITLE */
.signup-box h2{
    color:orange;
    font-size:28px;
    margin-bottom:5px;
}

.signup-box p{
    color:#bbb;
    font-size:14px;
    margin-bottom:25px;
}

/* INPUT */
.input-box{
    position:relative;
    margin-bottom:25px;
}

.input-box input{
    width:100%;
    padding:12px;
    background:transparent;
    border:none;
    border-bottom:2px solid #555;
    color:white;
    font-size:16px;
    outline:none;
}

/* FLOAT LABEL */
.input-box label{
    position:absolute;
    left:0;
    top:12px;
    color:#aaa;
    transition:0.3s;
    pointer-events:none;
}

/* LABEL ANIMATION */
.input-box input:focus ~ label,
.input-box input:valid ~ label{
    top:-10px;
    font-size:12px;
    color:orange;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:orange;
    border:none;
    border-radius:10px;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff8800;
    transform:scale(1.03);
}

</style>
</head>

<body>

<div class="signup-wrapper">

    <div class="signup-box">

        <h2>Create Account</h2>
        <p>Sign up to get started</p>

        <form method="POST">
            {% csrf_token %}

            <div class="input-box">
                <input type="text" name="username" required>
                <label>Username</label>
            </div>

            <div class="input-box">
                <input type="email" name="email" required>
                <label>Email</label>
            </div>

            <div class="input-box">
                <input type="password" name="password1" required>
                <label>Password</label>
            </div>

            <div class="input-box">
                <input type="password" name="password2" required>
                <label>Confirm Password</label>
            </div>

            <button type="submit">Sign Up</button>

        </form>

    </div>

</div>

</body>
</html>
